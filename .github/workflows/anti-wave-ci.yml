# Anti-wave verify branch — chay suite PB3 tren runner theo lenh dispatch.
#
# MUC DICH: agent (hoac user) verify 1 nhanh bat ky ma khong can VM local
# (dung luc song EPERM): dispatch workflow nay, poll run, tai artifact
# failset.json ve doc. Day la "terminal doc lap" cua nhiem vu Anti-Wave:
# runner chi chay workflow co san, khong chay lenh tuy y cua agent.
#
# !!! LUAT GITHUB (da do that 12:20 +07, xem docs/ACTIONS_VERIFY.md):
# workflow_dispatch CHI dispatch duoc khi file workflow DA CO TREN main
# (default branch). Truoc khi file nay duoc gop len main, dispatch tra 404
# (khong phai 403 — quyen Actions da co tac dung). Trong luc do, duong
# verify qua Actions la mo PR de test.yml tu chay.
#
# NGUON THAT CUA SUITE LA test.yml: cac buoc duoi day (checkout, Python
# 3.12, pip install lz4 pytest, kiem tra 8 fixture, khoi phuc font, lenh
# pytest) copy y nguyen tu test.yml. Neu test.yml doi lenh thi phai doi
# o day theo — KHONG tu che lenh pytest khac, KHONG dinh nghia suite rieng.
#   unit: pytest tests -q -rs -m "not needs_fixture" (1436 test)
#   full: pytest tests -q -rs, STRICT_FIXTURES=1 (1562 test, can fixture)
#   smoke: node .github/scripts/pyodide_smoke.mjs
#
# Khac test.yml o 2 diem, co chu dich:
#   (1) trigger workflow_dispatch thay vi push/PR — de agent goi duoc;
#   (2) moi job ghi them failset.json (danh sach test FAIL/ERROR rut tu
#       junit XML) de agent doc ket qua bang may, khong can doc het log.
#
# Chi phi: $0 (repo public, runner chuan mien phi). Thoi gian: unit ~10p,
# full ~25-30p, smoke ~15p (giong test.yml).
name: Anti-wave verify branch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Nhanh/commit can verify (de trong = nhanh duoc dispatch)"
        required: false
        default: ""
        type: string
      scope:
        description: "Pham vi chay"
        required: false
        default: "unit"
        type: choice
        options:
          - unit
          - full
          - smoke

env:
  FIXTURES_TAG: fixtures-v1
  FIXTURES_ASSET: pb3-fixtures-v1.zip
  STRICT_FIXTURES: "1"

jobs:
  unit:
    name: unit (khong can fixture nhi phan)
    if: inputs.scope == 'unit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.12 (CI — setup-python bo 3.9 tren Ubuntu 26.04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lz4 + pytest (suite can, ngoai stdlib)
        run: pip install lz4 pytest

      - name: Kiem tra fixture da co tren main (8 file, test dung that)
        run: |
          python3 - <<'EOF'
          import pathlib
          have = [
            "pb3/kb/pb3_kb.sqlite",
            "pb3/tests/fixtures/apple_plist/b.plist",
            "pb3/tests/fixtures/apple_strings/b.strings",
            "pb3/tests/fixtures/extract/ambig.zip",
            "pb3/tests/fixtures/extract/game1.zip",
            "pb3/tests/fixtures/generic_strings/sample.bin",
            "pb3/tests/fixtures/json_text/unicode.json",
            "pb3/tests/fixtures/po_mo/sample.mo",
          ]
          gone = [f for f in have if not pathlib.Path(f).is_file()]
          for f in have:
              print(("THIEU " if f in gone else "CO    ") + f)
          if gone:
              raise SystemExit("Thieu %d/%d file fixture tren main." % (len(gone), len(have)))
          print("Du 8/8 file fixture tren main.")
          EOF

      - name: Khoi phuc font (giai ma .b64 co san trong repo)
        run: |
          python3 - <<'EOF'
          import base64, pathlib
          raw = base64.b64decode(pathlib.Path("fonts/BeVietnamPro-Regular.ttf.b64").read_text().replace("\n", "").replace(" ", ""))
          pathlib.Path("pb3/fonts/BeVietnamPro-Regular.ttf").write_bytes(raw)
          print("font bytes:", len(raw))
          EOF

      - name: Run unit tests (1436 test, khong can fixture nhi phan)
        working-directory: pb3
        run: |
          set -o pipefail
          python3 -m pytest tests -q -rs -m "not needs_fixture" --junitxml=../test-report.xml 2>&1 | tee ../test-unit.log

      - name: Tao fail-set JSON (de agent doc ket qua bang may)
        if: always()
        run: |
          python3 - <<'EOF'
          import json, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path("test-report.xml")
          out = {"scope": "unit", "tests": 0, "failures": 0, "errors": 0,
                 "skipped": 0, "failed": [], "error_ids": []}
          if report.is_file():
              root = ET.parse(report).getroot()
              for suite in root.iter("testsuite"):
                  out["tests"] += int(suite.get("tests", 0) or 0)
                  out["failures"] += int(suite.get("failures", 0) or 0)
                  out["errors"] += int(suite.get("errors", 0) or 0)
                  out["skipped"] += int(suite.get("skipped", 0) or 0)
                  for case in suite.iter("testcase"):
                      cid = "%s::%s" % (case.get("classname", "?"), case.get("name", "?"))
                      if case.find("failure") is not None:
                          out["failed"].append(cid)
                      if case.find("error") is not None:
                          out["error_ids"].append(cid)
          else:
              out["note"] = "khong co test-report.xml (pytest chet truoc khi chay?)"
          pathlib.Path("failset.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print("failset: %d tests, %d failures, %d errors, %d skipped"
                % (out["tests"], out["failures"], out["errors"], out["skipped"]))
          EOF

      - name: Upload test log + fail-set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiwave-verify-unit
          path: |
            test-unit.log
            failset.json
          if-no-files-found: warn

  full:
    name: full (du fixture, toan bo suite)
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python 3.12 (CI — setup-python bo 3.9 tren Ubuntu 26.04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lz4 + pytest (suite can, ngoai stdlib)
        run: pip install lz4 pytest

      - name: Cache fixture nhi phan (Release asset)
        id: cache-fixtures
        uses: actions/cache@v4
        with:
          path: /tmp/pb3-fixtures-v1.zip
          # Doi key khi doi FIXTURES_TAG, neu khong CI dung cache cu.
          key: pb3-fixtures-fixtures-v1

      - name: Tai fixture nhi phan (Release asset fixtures-v1)
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$FIXTURES_TAG" --pattern "$FIXTURES_ASSET" --dir /tmp
          ls -l /tmp/"$FIXTURES_ASSET"

      - name: Giai nen + kiem tra du 20 fixture
        run: |
          python3 - <<'EOF'
          import pathlib, zipfile
          zipfile.ZipFile("/tmp/pb3-fixtures-v1.zip").extractall("pb3")
          want = """tests/fixtures/sqlite_loc/a.sqlite
          tests/fixtures/unity/nested.ipa
          tests/fixtures/unity/nested_v8.ipa
          tests/fixtures/unity/resources.assets
          tests/fixtures/unity/sample.unity3d
          tests/fixtures/unity/sample_lz4.unity3d
          tests/fixtures/unity/sample_lzma.unity3d
          tests/fixtures/unity/sample_typetree.assets
          tests/fixtures/unity/sample_v21.assets
          tests/fixtures/unity/sample_v23.assets
          tests/fixtures/unity/sample_v6.unity3d
          tests/fixtures/unity/sample_v8.unity3d
          tests/fixtures/unity/sample_v8_lz4.unity3d
          tests/fixtures/unity/sharedassets0.assets
          tests/fixtures/unreal_locres/legacy.locres
          tests/fixtures/unreal_locres/vi.locres
          tests/fixtures/unreal_pak/game_v11.pak
          tests/fixtures/unreal_pak/game_v8.pak
          tests/fixtures/xml_strings/unicode.xml
          tests/fixtures/zip/sample.ipa""".splitlines()
          gone = [f for f in want if not pathlib.Path("pb3", f).is_file()]
          for f in want:
              print(("THIEU " if f in gone else "CO    ") + f)
          if gone:
              raise SystemExit("Thieu %d/%d fixture tu Release asset." % (len(gone), len(want)))
          print("Du 20/20 fixture tu Release asset.")
          EOF

      - name: Khoi phuc font (giai ma .b64 co san trong repo)
        run: |
          python3 - <<'EOF'
          import base64, pathlib
          raw = base64.b64decode(pathlib.Path("fonts/BeVietnamPro-Regular.ttf.b64").read_text().replace("\n", "").replace(" ", ""))
          pathlib.Path("pb3/fonts/BeVietnamPro-Regular.ttf").write_bytes(raw)
          print("font bytes:", len(raw))
          EOF

      - name: Run full test suite (1562 test, STRICT_FIXTURES=1)
        working-directory: pb3
        run: |
          set -o pipefail
          python3 -m pytest tests -q -rs --junitxml=../test-report.xml 2>&1 | tee ../test-full.log

      - name: Tao fail-set JSON (de agent doc ket qua bang may)
        if: always()
        run: |
          python3 - <<'EOF'
          import json, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path("test-report.xml")
          out = {"scope": "full", "tests": 0, "failures": 0, "errors": 0,
                 "skipped": 0, "failed": [], "error_ids": []}
          if report.is_file():
              root = ET.parse(report).getroot()
              for suite in root.iter("testsuite"):
                  out["tests"] += int(suite.get("tests", 0) or 0)
                  out["failures"] += int(suite.get("failures", 0) or 0)
                  out["errors"] += int(suite.get("errors", 0) or 0)
                  out["skipped"] += int(suite.get("skipped", 0) or 0)
                  for case in suite.iter("testcase"):
                      cid = "%s::%s" % (case.get("classname", "?"), case.get("name", "?"))
                      if case.find("failure") is not None:
                          out["failed"].append(cid)
                      if case.find("error") is not None:
                          out["error_ids"].append(cid)
          else:
              out["note"] = "khong co test-report.xml (pytest chet truoc khi chay?)"
          pathlib.Path("failset.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print("failset: %d tests, %d failures, %d errors, %d skipped"
                % (out["tests"], out["failures"], out["errors"], out["skipped"]))
          EOF

      - name: Upload test log + fail-set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiwave-verify-full
          path: |
            test-full.log
            failset.json
          if-no-files-found: warn

  smoke:
    name: smoke qua Pyodide (kiem chung runtime trinh duyet)
    if: inputs.scope == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pytest smoke qua Pyodide (Node)
        run: node .github/scripts/pyodide_smoke.mjs
